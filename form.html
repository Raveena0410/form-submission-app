<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <STYLE>
        *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        }
        .s{
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            gap:15px;
            margin:30px auto;
            padding:20px;
            border:1px solid black;
            width:20%;
            border-radius:8px;
            


        }
        .c{
            display:flex;
            flex-direction:column;
            font-size:1.5rem;
            gap:10px;
            margin:10px;
        }
        .l{
            padding:10px;
            border-radius:8px;
        }
        .btn{
            padding:10px 40px;
            border-radius:8px;
            display:flex;
            flex-direction:column;
            gap:10px;
            background-color:pink;
            margin-top:20px;
        }
        input:hover{
            border:2px solid greenyellow;
        }
        

    </STYLE>
</head>
<body>
    <div class="s">
        <h1>ENQUIRY FORM</h1>
        
    <form action="" id="formd" method="">
        
        <div class="c">
        <label for="">NAME :</label>
        <input type="text"  name="name" placeholder="ENTER NAME ..." class="l">
        </div>
         
        <div class="c">
            <label for="">GENDER</label>
         <input type="text" name="gender"placeholder="ENTER ..." class="l">
        </div>
         <div class="c">
            <label for="">AGE</label>
         <input type="text" name="age"placeholder="ENTER ..." class="l">
         </div>
         
         <button class="btn">SUBMIT</button>
         




    </form>
    </div>
    <script>
        document.getElementById("formd").addEventListener("submit",async function(e){
            e.preventDefault();
            const formdata=new FormData(this);
            const data={
                name:formdata.get("name"),
                gender:formdata.get("gender"),
                age:formdata.get("age")

            };
            try{
            const response=await fetch("http://localhost:3000/api",{
                method:"POST",
              headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
            });
            const result = await response.json();
        alert(result.message);
        }

        
        catch(error){
        alert("Error sending data ");
        }
    });

    
    </script>
    
</body>
</html>
